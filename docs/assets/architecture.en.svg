<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" font-family="DejaVu Sans, Verdana, sans-serif">
  <defs>
    <linearGradient id="gBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EEF2FA"/>
    </linearGradient>
    <linearGradient id="gBlue2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E1F5FE"/>
      <stop offset="100%" stop-color="#B3E5FC"/>
    </linearGradient>
    <linearGradient id="gPurple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F3E5F5"/>
      <stop offset="100%" stop-color="#E1BEE7"/>
    </linearGradient>
    <linearGradient id="gYellow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFDE7"/>
      <stop offset="100%" stop-color="#FFF9C4"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#37474F"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="500" fill="url(#gBg)"/>

  <text x="600" y="36" text-anchor="middle" font-size="24" font-weight="700" fill="#1A237E">SBX + NeMo Guardrails — a safety gate in front of the local model</text>
  <text x="600" y="63" text-anchor="middle" font-size="13" font-style="italic" fill="#546E7A">docker-agent → nemo-guardrails → llmman: every message passes through the gate before the model</text>

  <!-- Sandbox docker-agent -->
  <g filter="url(#shadow)">
    <rect x="40" y="200" width="230" height="180" rx="16" fill="url(#gBlue2)" stroke="#0277BD" stroke-width="2"/>
  </g>
  <text x="155" y="245" text-anchor="middle" font-size="26">🤖</text>
  <text x="155" y="276" text-anchor="middle" font-size="16" font-weight="700" fill="#01579B">Sandbox: docker-agent</text>
  <text x="155" y="298" text-anchor="middle" font-size="12" fill="#01579B">user CLI/TUI agent</text>
  <text x="155" y="316" text-anchor="middle" font-size="12" fill="#01579B">openai-compatible provider</text>

  <!-- Sandbox nemo-guardrails -->
  <g filter="url(#shadow)">
    <rect x="520" y="190" width="260" height="190" rx="16" fill="url(#gPurple)" stroke="#6A1B9A" stroke-width="3"/>
  </g>
  <rect x="635" y="178" width="130" height="24" rx="12" fill="#6A1B9A"/>
  <text x="700" y="194.5" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">🔒 safety gate</text>
  <text x="650" y="233" text-anchor="middle" font-size="24">🛡</text>
  <text x="650" y="260" text-anchor="middle" font-size="16" font-weight="700" fill="#4A148C">Sandbox: nemo-guardrails</text>
  <text x="650" y="300" text-anchor="middle" font-size="12" fill="#4A148C">docker compose → nemoguardrails server</text>
  <text x="650" y="318" text-anchor="middle" font-size="12" fill="#4A148C">receives every message before the model</text>

  <!-- Host container -->
  <rect x="960" y="150" width="210" height="230" rx="10" fill="none" stroke="#90A4AE" stroke-width="2" stroke-dasharray="7,5"/>
  <text x="1065" y="172" text-anchor="middle" font-size="13" font-style="italic" font-weight="700" fill="#607D8B">🖥 Host machine (macOS/Linux)</text>

  <!-- llmman -->
  <g filter="url(#shadow)">
    <rect x="975" y="225" width="180" height="130" rx="16" fill="url(#gYellow)" stroke="#F9A825" stroke-width="2"/>
  </g>
  <text x="1065" y="265" text-anchor="middle" font-size="24">📦</text>
  <text x="1065" y="292" text-anchor="middle" font-size="15" font-weight="700" fill="#F57F17">llmman</text>
  <text x="1065" y="312" text-anchor="middle" font-size="11.5" fill="#F57F17">main + guard models</text>
  <text x="1065" y="328" text-anchor="middle" font-size="11.5" fill="#F57F17">OpenAI-compatible API</text>

  <!-- Edge A -> B -->
  <line x1="272" y1="290" x2="517" y2="285" stroke="#37474F" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="313" y="263" width="162" height="36" fill="#FAFBFF"/>
  <text x="394" y="277" text-anchor="middle" font-size="12.5" font-weight="700" fill="#263238">chat/completions</text>
  <text x="394" y="293" text-anchor="middle" font-size="10.5" fill="#607D8B">host.docker.internal:8000</text>

  <!-- Edge B -> llmman -->
  <line x1="782" y1="290" x2="972" y2="290" stroke="#37474F" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="800" y="263" width="155" height="36" fill="#FAFBFF"/>
  <text x="877" y="277" text-anchor="middle" font-size="12.5" font-weight="700" fill="#263238">engine: openai</text>
  <text x="877" y="293" text-anchor="middle" font-size="10.5" fill="#607D8B">host.docker.internal:17434</text>

  <!-- Caption -->
  <text x="600" y="428" text-anchor="middle" font-size="12" font-style="italic" font-weight="700" fill="#607D8B">⚠ No direct network link between two sbx sandboxes.</text>
  <text x="600" y="448" text-anchor="middle" font-size="12" font-style="italic" fill="#607D8B">Every arrow above actually goes through the host machine (sbx ports publish + host.docker.internal).</text>
</svg>
